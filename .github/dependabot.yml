version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Keep the toolchain in one PR to reduce review noise.
      dev-dependencies:
        patterns: ['*']
        dependency-type: development
    ignore:
      # typescript-eslint (8.72.2) caps the supported TypeScript range at
      # `>=4.8.4 <6.1.0` and hard-errors on TypeScript 7, which fails the lint
      # step. Drop this rule once typescript-eslint widens the range.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'
