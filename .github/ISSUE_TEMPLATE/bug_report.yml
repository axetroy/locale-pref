name: Bug report
description: Report something that does not work as documented.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for filing a bug. Please fill in as much as you can.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A snippet or repository that reproduces the issue.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: locale-pref version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Node.js version, browser and version, or bundler.
      placeholder: Node.js 24.9.0
    validations:
      required: true
